{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Restaurant</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="restaurant-container">
        <div class="restaurant-card">

            <h1>Update Restaurant</h1>
            <p>Edit your restaurant information</p>

            <form action="{% url 'update_restaurant' restaurant.id %}" method="post">
                {% csrf_token %}

                <label>Restaurant Name</label>
                <input type="text" name="name" value="{{ restaurant.name }}" required>

                <label>Picture URL</label>
                <input type="text" name="picture" value="{{ restaurant.picture }}" required>

                <label>Cuisine</label>
                <input type="text" name="cuisine" value="{{ restaurant.cuisine }}" required>

                <label>Rating</label>
                <input type="number" name="rating" min="0" max="5" step="0.5" value="{{ restaurant.rating }}" required>

                <button type="submit">Update Restaurant</button>
            </form>

        </div>
    </div>

</body>
</html>
